name: 04-staff-credentials
description: |-
  e2e: Auth › POST /api/auth/login
  it: should refuse %s with the same 401
  Row: the credentials of a staff user

  Expect: 401 Unauthorized, code AUTH_INVALID_CREDENTIALS
method: POST
url: $CUSTOMER_APP_BASE_URL/auth/login
body:
  content: |-
    {
      "email": "editor@example.com",
      "password": "editor-password-please-change"
    }
headers:
  - name: Content-Type
    value: application/json
