name: 11-key-in-flight
description: |-
  e2e: Order › POST /api/orders
  it: should refuse a key still in flight with 409 and write nothing

  Expect: 409 Conflict, code IDEMPOTENT_REQUEST_IN_FLIGHT; no order is written and the key stays in flight
  User: ann@example.com (token signed by scripts.py)
  Before: SQL: INSERT INTO idempotency_key (scope, idempotency_key, request_fingerprint, status, response_body, created_at) VALUES ('customer:101', 'e2e-order-in-flight-key', 'fc4a75a01f544cbe89b1a4bf576e860b31ec0fbd17f55b3ca9d0028be91fc694', 'in_flight', NULL, CURRENT_TIMESTAMP)
  After: SQL: DELETE FROM idempotency_key WHERE idempotency_key = 'e2e-order-in-flight-key'
  Note: the fingerprint is BodyFingerprintHelper.compute({ productIds: ['100'] }), the body of this request
method: POST
url: $CUSTOMER_APP_BASE_URL/orders
body:
  content: |-
    {
      "productIds": [
        "100"
      ]
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Idempotency-Key
    value: e2e-order-in-flight-key
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_ann
