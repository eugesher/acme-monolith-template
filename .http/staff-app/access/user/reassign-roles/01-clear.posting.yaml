name: 01-clear
description: |-
  e2e: Access › User › PUT /api/access/users/:userId/roles
  it: should clear the roles with an empty list and answer 200

  Expect: 200 OK, user 4 with no roles
  User: admin@example.com (token signed by scripts.py)
  After: SQL: INSERT INTO staff_user_roles (user_id, role_id) VALUES (4, 3)
method: PUT
url: $STAFF_APP_BASE_URL/access/users/4/roles
body:
  content: |-
    {
      "roleIds": []
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_admin
