name: 06-suffixed-id
description: |-
  e2e: Access › User › PUT /api/access/users/:userId/roles › should refuse a number with a suffix as the user id with 400 from validation and change nothing

  Expect: 400 Bad Request, code VALIDATION_FAILED, userId must be a positive integer; the admin keeps role 1
  User: admin@example.com (token signed by scripts.py)
method: PUT
url: $STAFF_APP_BASE_URL/access/users/1abc/roles
body:
  content: |-
    {
      "roleIds": []
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_admin
