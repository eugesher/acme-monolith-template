name: 02-unknown-role
description: |-
  e2e: Access › User › POST /api/access/users
  it: should refuse a role that is not stored with 422 and create no user

  Expect: 422 Unprocessable Entity, code AUTH_ROLE_NOT_FOUND, no user unknown-role@example.com
  User: admin@example.com (token signed by scripts.py)
method: POST
url: $STAFF_APP_BASE_URL/access/users
body:
  content: |-
    {
      "email": "unknown-role@example.com",
      "password": "unknown-role-password-please-change",
      "roleIds": ["3", "99"]
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_admin
