name: 02-wrong-password
description: |-
  e2e: Auth › POST /api/auth/login
  it: should refuse %s with the same 401
  Row: a wrong password

  Expect: 401 Unauthorized, code AUTH_INVALID_CREDENTIALS
method: POST
url: $STAFF_APP_BASE_URL/auth/login
body:
  content: |-
    {
      "email": "editor@example.com",
      "password": "wrong-password-123"
    }
headers:
  - name: Content-Type
    value: application/json
