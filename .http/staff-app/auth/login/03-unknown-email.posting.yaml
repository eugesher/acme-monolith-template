name: 03-unknown-email
description: |-
  e2e: Auth › POST /api/auth/login
  it: should refuse %s with the same 401
  Row: an unknown email

  Expect: 401 Unauthorized, code AUTH_INVALID_CREDENTIALS
method: POST
url: $STAFF_APP_BASE_URL/auth/login
body:
  content: |-
    {
      "email": "nobody@example.com",
      "password": "editor-password-please-change"
    }
headers:
  - name: Content-Type
    value: application/json
