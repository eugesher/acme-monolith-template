name: 01-success
description: |-
  e2e: Catalog › Product › POST /api/catalog/products/:productId/archive
  it: should archive, queue one ledger record under the correlation id and drop the cached customer catalog

  Expect: 200 OK, product 103 archived at version 2, one ledger record product-archived:103:2 with correlation_id e2e00000-0000-4000-8000-000000000015; no acme:catalog:* key left
  User: editor@example.com (token signed by scripts.py)
  Before: Redis: SET acme:catalog:v1:page:1:limit:20 '{}'
method: POST
url: $STAFF_APP_BASE_URL/catalog/products/103/archive
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: If-Match
    value: '1'
  - name: x-correlation-id
    value: e2e00000-0000-4000-8000-000000000015
scripts:
  setup: scripts.py:as_editor
