name: 01-create
description: |-
  e2e: Catalog › Product › POST /api/catalog/products
  it: should create a draft and queue the ledger record under the correlation id

  Expect: 201 Created; product and a ledger entry product-created with correlation_id e2e00000-0000-4000-8000-000000000014
  User: editor@example.com (token signed by scripts.py)
method: POST
url: $STAFF_APP_BASE_URL/catalog/products
body:
  content: |-
    {
      "sku": "E2E-0001",
      "name": "Created product"
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: x-correlation-id
    value: e2e00000-0000-4000-8000-000000000014
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
