name: 02-tag
description: |-
  e2e: Catalog › Product › GET /api/catalog/products
  it: should list only the products that carry the tag

  Expect: 200 OK, products 101 and 100, total 2
  User: viewer@example.com (token signed by scripts.py)
url: $STAFF_APP_BASE_URL/catalog/products
params:
  - name: tagId
    value: '300'
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_viewer
