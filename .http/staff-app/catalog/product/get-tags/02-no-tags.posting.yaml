name: 02-no-tags
description: |-
  e2e: Catalog › Product › GET /api/catalog/products/:productId/tags › should answer an empty list for a product without tags

  Expect: 200 OK, an empty list
  User: viewer@example.com (token signed by scripts.py)
url: $STAFF_APP_BASE_URL/catalog/products/103/tags
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_viewer
