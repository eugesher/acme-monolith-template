name: 01-link
description: |-
  e2e: Catalog › Product › PUT /api/catalog/products/:productId/tags
  it: should link the tags of the body and answer them by name

  Expect: 200 OK, tags fragile and promo; two subject_tag rows of product 103
  User: editor@example.com (token signed by scripts.py)
  After: SQL: DELETE FROM subject_tag WHERE subject_type = 'product' AND subject_id = 103
method: PUT
url: $STAFF_APP_BASE_URL/catalog/products/103/tags
body:
  content: |-
    {
      "tagIds": ["301", "300", "300"]
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
