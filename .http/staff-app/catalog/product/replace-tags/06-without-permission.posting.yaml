name: 06-without-permission
description: |-
  e2e: Catalog › Product › PUT /api/catalog/products/:productId/tags › should refuse a role without product:write with 403

  Expect: 403 Forbidden, code FORBIDDEN
  User: editor@example.com (token signed by scripts.py)
  Before: SQL: DELETE FROM staff_role_permissions WHERE role_id = 2 AND code = 'product:write'
  After: SQL: INSERT INTO staff_role_permissions (role_id, code) VALUES (2, 'product:write')
method: PUT
url: $STAFF_APP_BASE_URL/catalog/products/103/tags
body:
  content: |-
    {
      "tagIds": ["300"]
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
