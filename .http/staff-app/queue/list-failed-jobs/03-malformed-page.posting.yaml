name: 03-malformed-page
description: |-
  e2e: Queue › GET /api/queues/:queueName/jobs/failed › should refuse a malformed page with 400 from validation

  Expect: 400 Bad Request, code VALIDATION_FAILED, field page
  User: viewer@example.com (token signed by scripts.py)
url: $STAFF_APP_BASE_URL/queues/ledger-record/jobs/failed
params:
  - name: page
    value: first
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_viewer
