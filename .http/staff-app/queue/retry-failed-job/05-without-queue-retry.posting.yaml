name: 05-without-queue-retry
description: |-
  e2e: Queue › POST /api/queues/:queueName/jobs/failed/:jobId/retry › should refuse a user without queue:retry with 403

  Expect: 403 Forbidden
  User: viewer@example.com (token signed by scripts.py)
method: POST
url: $STAFF_APP_BASE_URL/queues/ledger-record/jobs/failed/1/retry
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_viewer
