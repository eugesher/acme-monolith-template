name: 03-tag
description: |-
  e2e: Sales › Order › GET /api/sales/orders › should list only the orders that carry the tag

  Expect: 200 OK, order 600 alone, total 1
  User: viewer@example.com (token signed by scripts.py)
url: $STAFF_APP_BASE_URL/sales/orders
params:
  - name: tagId
    value: '302'
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_viewer
