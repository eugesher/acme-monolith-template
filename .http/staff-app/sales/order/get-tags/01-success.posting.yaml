name: 01-success
description: |-
  e2e: Sales › Order › GET /api/sales/orders/:orderId/tags
  it: should read the tags of the order, by name

  Expect: 200 OK, tag vip
  User: viewer@example.com (token signed by scripts.py)
url: $STAFF_APP_BASE_URL/sales/orders/600/tags
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_viewer
