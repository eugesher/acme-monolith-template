name: 02-replace
description: |-
  e2e: Sales › Order › PUT /api/sales/orders/:orderId/tags
  it: should replace the tags the order had and clear them with an empty list

  Expect: 200 OK, tag fragile alone
  User: editor@example.com (token signed by scripts.py)
  Before: send this request with the body {"tagIds": ["302", "300"]}: 200 OK
  After: SQL: DELETE FROM subject_tag WHERE subject_type = 'order' AND subject_id = 601
  Note: the e2e then sends {"tagIds": []} and gets an empty list
method: PUT
url: $STAFF_APP_BASE_URL/sales/orders/601/tags
body:
  content: |-
    {
      "tagIds": ["300"]
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
