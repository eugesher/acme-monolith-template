name: 05-word-tag-id
description: |-
  e2e: Sales › Order › PUT /api/sales/orders/:orderId/tags › should refuse a word among the tag ids with 400 from validation

  Expect: 400 Bad Request, code VALIDATION_FAILED, each value in tagIds must be a positive integer
  User: editor@example.com (token signed by scripts.py)
method: PUT
url: $STAFF_APP_BASE_URL/sales/orders/601/tags
body:
  content: |-
    {
      "tagIds": ["fragile"]
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
