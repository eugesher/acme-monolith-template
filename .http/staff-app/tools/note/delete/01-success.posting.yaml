name: 01-success
description: |-
  e2e: Tools › Note › DELETE /api/tools/notes/:noteId
  it: should soft-delete a note and hide it from every read

  Expect: 204 No Content, note 200 gets deleted_at; GET of note 200 and of its revisions answers 404 NOTE_NOT_FOUND
  User: admin@example.com (token signed by scripts.py)
method: DELETE
url: $STAFF_APP_BASE_URL/tools/notes/200
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_admin
