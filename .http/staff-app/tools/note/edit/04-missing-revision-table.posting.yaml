name: 04-missing-revision-table
description: |-
  e2e: Tools › Note › PATCH /api/tools/notes/:noteId › should answer 500 and roll the note back when the revision table is missing

  Expect: 500 Internal Server Error, code INTERNAL_SERVER_ERROR; note 203 stays at version 1 with its body
  User: admin@example.com (token signed by scripts.py)
  Before: SQL: RENAME TABLE note_revision TO note_revision_moved
  After: SQL: RENAME TABLE note_revision_moved TO note_revision
method: PATCH
url: $STAFF_APP_BASE_URL/tools/notes/203
body:
  content: |-
    {
      "body": "This edit fails on the revision."
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_admin
