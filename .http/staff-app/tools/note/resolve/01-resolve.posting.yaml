name: 01-resolve
description: |-
  e2e: Tools › Note › POST /api/tools/notes/:noteId/resolve › should resolve a note under a matching If-Match

  Expect: 200 OK, note 201 resolved at version 2
  User: admin@example.com (token signed by scripts.py)
method: POST
url: $STAFF_APP_BASE_URL/tools/notes/201/resolve
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: If-Match
    value: '1'
scripts:
  setup: scripts.py:as_admin
