name: 01-success
description: |-
  e2e: Tools › Note › PATCH /api/tools/notes/:noteId
  it: should rewrite the body under a matching If-Match and record a revision under the correlation id

  Expect: 200 OK, note 200 at version 2, one revision with correlation_id e2e00000-0000-4000-8000-000000000018
  User: admin@example.com (token signed by scripts.py)
method: PATCH
url: $STAFF_APP_BASE_URL/tools/notes/200
body:
  content: |-
    {
      "body": "Customer called twice; refunded manually."
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: If-Match
    value: '1'
  - name: x-correlation-id
    value: e2e00000-0000-4000-8000-000000000018
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_admin
