name: 01-success
description: |-
  e2e: Tools › Tag › POST /api/tools/tags
  it: should create a tag with the trimmed name

  Expect: 201 Created, a tag named heavy
  User: editor@example.com (token signed by scripts.py)
  After: SQL: DELETE FROM tag WHERE name = 'heavy'
method: POST
url: $STAFF_APP_BASE_URL/tools/tags
body:
  content: |-
    {
      "name": "  heavy  "
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
