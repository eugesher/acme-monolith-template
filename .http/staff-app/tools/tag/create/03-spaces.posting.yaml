name: 03-spaces
description: |-
  e2e: Tools › Tag › POST /api/tools/tags › should refuse a name of spaces with 400 from the domain

  Expect: 400 Bad Request, code TAG_NAME_INVALID
  User: editor@example.com (token signed by scripts.py)
method: POST
url: $STAFF_APP_BASE_URL/tools/tags
body:
  content: |-
    {
      "name": "   "
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
