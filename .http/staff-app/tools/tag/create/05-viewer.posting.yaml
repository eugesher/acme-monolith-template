name: 05-viewer
description: |-
  e2e: Tools › Tag › POST /api/tools/tags › should refuse a role without tag:write with 403

  Expect: 403 Forbidden, code FORBIDDEN
  User: viewer@example.com (token signed by scripts.py)
method: POST
url: $STAFF_APP_BASE_URL/tools/tags
body:
  content: |-
    {
      "name": "heavy"
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_viewer
