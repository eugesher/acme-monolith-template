name: 01-delete
description: |-
  e2e: Tools › Tag › DELETE /api/tools/tags/:tagId
  it: should delete the tag and unlink it from every subject

  Expect: 204 No Content; tag 391 and its tag_subject rows of product 102 and order 601 are gone
  User: editor@example.com (token signed by scripts.py)
  Before: SQL: INSERT INTO tag (id, name, created_at, updated_at) VALUES (391, 'clearance', '2026-01-01 00:00:00', '2026-01-01 00:00:00')
  Before: SQL: INSERT INTO tag_subject (tag_id, subject_type, subject_id, created_at) VALUES (391, 'product', 102, '2026-01-01 00:00:00'), (391, 'order', 601, '2026-01-01 00:00:00')
  After: SQL: DELETE FROM tag_subject WHERE tag_id = 391
  After: SQL: DELETE FROM tag WHERE id = 391
method: DELETE
url: $STAFF_APP_BASE_URL/tools/tags/391
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_editor
