name: 01-delete
description: |-
  e2e: Tools › Tag › DELETE /api/tools/tags/:tagId › should delete the tag and unlink it from every subject

  Expect: 204 No Content; tag 391 and its subject_tag rows of product 102 and order 601 are gone
  User: editor@example.com (token signed by scripts.py)
  Before: SQL: INSERT INTO tag (id, name, created_at, updated_at) VALUES (391, 'clearance', '2026-01-01 00:00:00', '2026-01-01 00:00:00')
  Before: SQL: INSERT INTO subject_tag (id, subject_type, subject_id, tag_id, created_at) VALUES (491, 'product', 102, 391, '2026-01-01 00:00:00'), (492, 'order', 601, 391, '2026-01-01 00:00:00')
  After: SQL: DELETE FROM subject_tag WHERE id IN (491, 492)
  After: SQL: DELETE FROM tag WHERE id = 391
method: DELETE
url: $STAFF_APP_BASE_URL/tools/tags/391
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_editor
