name: 02-unknown
description: |-
  e2e: Tools › Tag › DELETE /api/tools/tags/:tagId › should answer an unknown tag with 404

  Expect: 404 Not Found, code TAG_NOT_FOUND
  User: editor@example.com (token signed by scripts.py)
method: DELETE
url: $STAFF_APP_BASE_URL/tools/tags/999
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_editor
