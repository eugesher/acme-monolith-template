name: 02-page-window
description: |-
  e2e: Tools › Tag › GET /api/tools/tags › should answer the page window it was asked for

  Expect: 200 OK, vip alone, page 2 of limit 2, total 3
  User: viewer@example.com (token signed by scripts.py)
url: $STAFF_APP_BASE_URL/tools/tags
params:
  - name: page
    value: '2'
  - name: limit
    value: '2'
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_viewer
