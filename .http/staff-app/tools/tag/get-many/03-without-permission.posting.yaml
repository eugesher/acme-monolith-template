name: 03-without-permission
description: |-
  e2e: Tools › Tag › GET /api/tools/tags › should refuse a role without tag:read with 403

  Expect: 403 Forbidden, code FORBIDDEN
  User: viewer@example.com (token signed by scripts.py)
  Before: SQL: DELETE FROM staff_role_permissions WHERE role_id = 3 AND code = 'tag:read'
  After: SQL: INSERT INTO staff_role_permissions (role_id, code) VALUES (3, 'tag:read')
url: $STAFF_APP_BASE_URL/tools/tags
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_viewer
