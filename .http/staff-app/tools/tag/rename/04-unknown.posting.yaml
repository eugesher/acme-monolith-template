name: 04-unknown
description: |-
  e2e: Tools › Tag › PATCH /api/tools/tags/:tagId › should answer an unknown tag with 404

  Expect: 404 Not Found, code TAG_NOT_FOUND
  User: editor@example.com (token signed by scripts.py)
  Before: SQL: INSERT INTO tag (id, name, created_at, updated_at) VALUES (390, 'seasonal', '2026-01-01 00:00:00', '2026-01-01 00:00:00')
  After: SQL: DELETE FROM tag WHERE id = 390
method: PATCH
url: $STAFF_APP_BASE_URL/tools/tags/999
body:
  content: |-
    {
      "name": "winter"
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
