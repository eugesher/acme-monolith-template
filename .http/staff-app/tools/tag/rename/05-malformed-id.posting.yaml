name: 05-malformed-id
description: |-
  e2e: Tools › Tag › PATCH /api/tools/tags/:tagId › should refuse a malformed tag id with 400 from validation

  Expect: 400 Bad Request, code VALIDATION_FAILED, tagId must be a positive integer
  User: editor@example.com (token signed by scripts.py)
  Before: SQL: INSERT INTO tag (id, name, created_at, updated_at) VALUES (390, 'seasonal', '2026-01-01 00:00:00', '2026-01-01 00:00:00')
  After: SQL: DELETE FROM tag WHERE id = 390
method: PATCH
url: $STAFF_APP_BASE_URL/tools/tags/abc
body:
  content: |-
    {
      "name": "winter"
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
