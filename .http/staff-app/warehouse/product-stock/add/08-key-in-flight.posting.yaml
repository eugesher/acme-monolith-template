name: 08-key-in-flight
description: |-
  e2e: Warehouse › ProductStock › POST /api/warehouse/product-stock/:productId/add
  it: should refuse a key still in flight with 409 and add nothing

  Expect: 409 Conflict, code IDEMPOTENT_REQUEST_IN_FLIGHT; no stock row is written and the key stays in flight
  User: editor@example.com (token signed by scripts.py)
  Before: SQL: INSERT INTO idempotency_key (scope, idempotency_key, request_fingerprint, status, response_body, created_at) VALUES ('staff:2', 'e2e-restock-in-flight-key', '03b6b831efbd1658f5e6f4de614be1fdf92d854214fbb2d77d45c2111c66bc67', 'in_flight', NULL, CURRENT_TIMESTAMP)
  After: SQL: DELETE FROM idempotency_key WHERE idempotency_key = 'e2e-restock-in-flight-key'
  Note: the fingerprint is BodyFingerprintHelper.compute({ productId: '100', quantity: 5 }), the path and the body of this request
method: POST
url: $STAFF_APP_BASE_URL/warehouse/product-stock/100/add
body:
  content: |-
    {
      "quantity": 5
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Idempotency-Key
    value: e2e-restock-in-flight-key
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
